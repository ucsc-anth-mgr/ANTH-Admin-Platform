<script>
// ============================================================
// _Scripts.html — Client-side App framework (v2.3)
//
// v2.1: Navigation state now lives in the PARENT (address-bar) URL via
// google.script.history / google.script.url. Apps Script web apps run in
// a sandboxed iframe, so window.location inside the app is the iframe's
// URL — writing a hash there never reaches the address bar and never
// survives a browser refresh. The google.script pair is the supported
// bridge to the real URL. Side benefit: writing the hash with null params
// consumes any ?page=&focus= deep-link parameters after first use, so a
// deep link opens focused exactly once instead of replaying on every
// refresh.
//
// v2.2: Accessibility + output-encoding pass.
//  - New A11y service: live-region announcements, a reusable modal focus
//    trap, and main-content focus management on navigation.
//  - Toast now ESCAPES its message (it receives server error text, which
//    is built from user data — it was an XSS sink).
//  - FormHelper wires aria-invalid / aria-describedby, focuses the first
//    bad field, and announces failures.
//  - _esc() now escapes single quotes (its output lands inside
//    onclick="...('…')" attributes).
//
// v2.3: Shell-level busy overlay (App.busy / App.busyProgress / App.idle,
// plus #app-busy in Index.html).
//  - App.call() and loadModule() arm the overlay AUTOMATICALLY on every
//    server round-trip, so a lagging call blocks stray clicks in every
//    module with no module code required. A 300 ms flicker guard keeps
//    instantaneous calls from flashing it, and a pending-call counter
//    keeps overlapping calls from hiding it early. Both the success and
//    the failure paths release it, so a module can never strand the user
//    behind the blocker.
//  - App.call() gained an optional 6th argument, busyMsg, to customize
//    the overlay text for that call ("Submitting petition…"); omitted,
//    it reads "Working…". Fully backward compatible.
//  - Modules' local busy overlays (#th-busy, #tr-busy, #is-busy,
//    #cwp-busy) are now redundant: their _busy/_idle helpers should
//    become one-line wrappers over App.busy/App.idle (which also
//    preserves their custom messages), and the local overlay markup
//    can be deleted.
// ============================================================


// ============================================================
// A11y — shared accessibility services
// ============================================================
// Depends on two live regions and a focusable main container declared in
// Index.html (#a11y-status, #a11y-alert, #module-container[tabindex="-1"]).
const A11y = (() => {

  // Elements that can receive keyboard focus, for the modal trap.
  const FOCUSABLE = [
    'a[href]', 'area[href]',
    'input:not([disabled]):not([type="hidden"])',
    'select:not([disabled])', 'textarea:not([disabled])',
    'button:not([disabled])', 'iframe', 'object', 'embed',
    '[tabindex]:not([tabindex="-1"])', '[contenteditable="true"]',
  ].join(',');

  let _trap = null;   // { container, previous, onKeydown }

  /**
   * Announces a message to screen readers without moving focus.
   * assertive=true interrupts (use for errors); default is polite.
   * The clear-then-set dance is required: setting identical text to a
   * live region twice in a row is not re-announced.
   */
  function announce(msg, assertive) {
    const el = document.getElementById(assertive ? 'a11y-alert' : 'a11y-status');
    if (!el) return;
    el.textContent = '';
    setTimeout(function () { el.textContent = String(msg == null ? '' : msg); }, 50);
  }

  /** Visible, focusable descendants of a container, in DOM order. */
  function focusables(container) {
    return Array.prototype.slice.call(container.querySelectorAll(FOCUSABLE))
      .filter(function (el) {
        return el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement;
      });
  }

  /**
   * Traps Tab within `container` and moves focus into it.
   *
   * opts.initialFocus  — element to focus first (default: first focusable)
   * opts.returnFocusTo — element to restore on release (default: whatever
   *                      had focus when trap() was called)
   *
   * NOTE for module authors: if your module already keeps its own
   * `_lastFocus` and restores it in closeModal(), REMOVE that when you
   * adopt this — release() restores focus itself, and doing both makes
   * focus jump twice.
   */
  function trap(container, opts) {
    if (!container) return;
    release();
    opts = opts || {};
    const previous = opts.returnFocusTo || document.activeElement;

    function onKeydown(e) {
      if (e.key !== 'Tab') return;
      const list = focusables(container);
      if (!list.length) { e.preventDefault(); container.focus(); return; }
      const first = list[0];
      const last  = list[list.length - 1];
      const inside = container.contains(document.activeElement);
      if (e.shiftKey && (document.activeElement === first || !inside)) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && (document.activeElement === last || !inside)) {
        e.preventDefault(); first.focus();
      }
    }

    // Capture phase, so the trap sees Tab before anything else can stop it.
    document.addEventListener('keydown', onKeydown, true);
    _trap = { container: container, previous: previous, onKeydown: onKeydown };

    if (!container.hasAttribute('tabindex')) container.setAttribute('tabindex', '-1');
    const list = focusables(container);
    const target = opts.initialFocus || list[0] || container;
    // Deferred: the dialog is often display:none at call time, and a
    // hidden element cannot take focus.
    setTimeout(function () { try { target.focus(); } catch (e) {} }, 0);
  }

  /** Releases the current trap and restores focus to the opener. */
  function release() {
    if (!_trap) return;
    document.removeEventListener('keydown', _trap.onKeydown, true);
    const prev = _trap.previous;
    _trap = null;
    if (prev && document.contains(prev) && typeof prev.focus === 'function') {
      try { prev.focus(); } catch (e) {}
    }
  }

  /** True when a trap is currently active (useful for Escape handlers). */
  function trapped() { return !!_trap; }

  /**
   * Moves focus to the main content region. Called after every navigation:
   * in a single-page shell, swapping the container's innerHTML leaves focus
   * orphaned on the nav link, so keyboard and screen-reader users have no
   * idea the page changed.
   */
  function focusMain() {
    const el = document.getElementById('module-container');
    if (!el) return;
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
    try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
  }

  return { announce: announce, trap: trap, release: release, trapped: trapped,
           focusMain: focusMain, focusables: focusables, FOCUSABLE: FOCUSABLE };
})();


const App = (() => {
  let _state = { userEmail: '', userName: '', userRoles: [], activePage: '', modules: [], tasks: [], publicBaseUrl: '' };

  // Whether the parent URL carried a ?page= deep-link parameter this
  // session. Apps Script's history.replace() does not reliably remove
  // existing query params, so when this is true the shell always keeps an
  // explicit restore hash (even #dashboard) — the hash outranks the
  // lingering params at routing time, making them harmless.
  let _hadPageParam = false;

  // The document title as first rendered, used as the suffix when a module
  // updates it (e.g. "Thesis · Anthropology Portal").
  const _baseTitle = document.title;

  function init(state) {
    Object.assign(_state, state);
    // All routing decisions need the PARENT (address-bar) URL — the
    // iframe's own window.location never survives a reload. getLocation is
    // async; until it answers the shell just shows the empty container for
    // a few dozen ms.
    try {
      google.script.url.getLocation(_route);
    } catch (e) {
      // google.script.url unavailable (shouldn't happen in IFRAME mode) —
      // route with no location rather than showing a blank page.
      _route(null);
    }
  }

  // Routing precedence:
  //   1. Restore hash (#module) — a hash means this session has already
  //      navigated past any deep link, so it OUTRANKS ?page=&focus=. This
  //      is what stops a lingering deep-link param from replaying on every
  //      refresh. '#dashboard' is a valid sentinel (see _setHash).
  //   2. Deep link — the server saw ?page= (and maybe &focus=) and passed
  //      them through as activePage / initialFocus. Open focused; once the
  //      module loads, _setHash() writes the hash so rule 1 takes over.
  //   3. Dashboard — the default view.
  function _route(loc) {
    _hadPageParam = !!(loc && loc.parameter && loc.parameter.page);
    const hashKey = ((loc && loc.hash) || '').trim();

    if (hashKey === 'dashboard') { goDashboard(); return; }
    if (hashKey && _moduleAllowed(hashKey)) { loadModule(hashKey, null); return; }

    if (_state.activePage && _state.activePage !== 'dashboard') {
      loadModule(_state.activePage, _state.initialFocus || null);
      return;
    }
    goDashboard();   // also clears a stale/forbidden hash via _setHash
  }

  // ── Dashboard ─────────────────────────────────────────────
  function goDashboard() {
    _setActiveNav('dashboard');
    _state.activePage = 'dashboard';
    _setHash('dashboard');   // dashboard is the default → clears hash + params
    window.__focus = null;   // clear any stale deep-link focus
    A11y.release();          // drop any modal trap left by the outgoing module
    const greeting = _state.userName ? `Welcome, ${_esc(_state.userName)}` : 'Welcome';
    document.getElementById('module-container').innerHTML = `
      <div class="dashboard">
        <div class="card welcome-card">
          <h1 class="welcome-title" id="module-heading" tabindex="-1">${greeting}</h1>
          <p class="text-muted" style="margin-bottom:0;">Here's what needs your attention.</p>
        </div>
        <div class="card" id="tasks-card">
          <div class="card-title" style="justify-content:space-between;">
            <span style="display:flex;align-items:center;gap:8px;">
              <i class="ti ti-checklist" aria-hidden="true"></i> Needs your attention
            </span>
            <button class="btn btn-secondary btn-sm" onclick="App.refreshTasks()"
                    title="Refresh" aria-label="Refresh tasks">
              <i class="ti ti-refresh" aria-hidden="true"></i>
            </button>
          </div>
          <div id="tasks-list"></div>
        </div>
      </div>`;
    _renderTasks();
    _setTitle('Dashboard');
    A11y.focusMain();
    A11y.announce('Dashboard loaded.');
  }

  function _renderTasks() {
    const el = document.getElementById('tasks-list');
    if (!el) return;
    const tasks = _state.tasks || [];
    if (!tasks.length) {
      el.innerHTML = `<div class="empty-state" style="padding:28px;">
        <i class="ti ti-circle-check" style="font-size:28px;color:var(--color-success);" aria-hidden="true"></i>
        <p style="margin-top:8px;">You're all caught up — no tasks right now.</p>
      </div>`;
      return;
    }
    el.innerHTML = `<ul class="task-list">${tasks.map(_taskRow).join('')}</ul>`;
  }

  function _taskRow(t) {
    const u = _urgencyMeta(t.urgency);
    const when = _taskTiming(t);
    const label = _esc(t.label || '(untitled task)');
    // Deep-link payload is passed by id lookup at click time (avoids quoting issues).
    // Space activates as well as Enter, per the button role's contract;
    // keydown (not the deprecated keypress) so Space is actually delivered.
    return `<li class="task-item urgency-${_esc(t.urgency || 'normal')}"
        onclick="App.openTask('${_esc(t.taskId)}')" role="button" tabindex="0"
        aria-label="${u.label}: ${label}"
        onkeydown="App.taskKey(event, '${_esc(t.taskId)}')">
      <span class="task-badge badge-${u.cls}">
        <i class="ti ${u.icon}" aria-hidden="true"></i> ${u.label}
      </span>
      <span class="task-label">${label}</span>
      <span class="task-when text-muted">${_esc(when)}</span>
      <i class="ti ti-chevron-right task-chev" aria-hidden="true"></i>
    </li>`;
  }

  /** Keyboard activation for task rows (Enter / Space). */
  function taskKey(ev, taskId) {
    if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
      ev.preventDefault();
      openTask(taskId);
    }
  }

  function _urgencyMeta(urgency) {
    switch (urgency) {
      case 'overdue':  return { cls: 'danger',  icon: 'ti-alert-triangle', label: 'Overdue' };
      case 'due_soon': return { cls: 'warning', icon: 'ti-clock',          label: 'Due soon' };
      case 'stale':    return { cls: 'muted',   icon: 'ti-hourglass',      label: 'Needs follow-up' };
      default:         return { cls: 'normal',  icon: 'ti-point',          label: 'Open' };
    }
  }

  // Human-readable timing line: prefer a due date, else show age.
  function _taskTiming(t) {
    if (t.dueAt) {
      const due = new Date(t.dueAt);
      if (!isNaN(due.getTime())) {
        const days = Math.round((due.getTime() - Date.now()) / 86400000);
        if (days < 0)  return `due ${Math.abs(days)}d ago`;
        if (days === 0) return 'due today';
        return `due in ${days}d`;
      }
    }
    if (t.createdAt) {
      const created = new Date(t.createdAt);
      if (!isNaN(created.getTime())) {
        const days = Math.floor((Date.now() - created.getTime()) / 86400000);
        return days <= 0 ? 'opened today' : `opened ${days}d ago`;
      }
    }
    return '';
  }

  // Deep-link: open the owning module focused on the task's source record.
  function openTask(taskId) {
    const t = (_state.tasks || []).find(x => x.taskId === taskId);
    if (!t) return;
    if (!t.module) { Toast.show('This task has no linked module.', 'error'); return; }
    loadModule(t.module, { sourceType: t.sourceType, sourceId: t.sourceId, taskId: t.taskId });
  }

  // Refresh tasks in place (no full reload), via the shell-level endpoint.
  // Busy-armed like every other round-trip: a laggy refresh blocks clicks
  // too (the overlay only appears if it lags past the flicker guard).
  function refreshTasks() {
    _busyBegin('Refreshing tasks…');
    google.script.run
      .withSuccessHandler(tasks => {
        _busyEnd();
        _state.tasks = tasks || [];
        _renderTasks();
        A11y.announce(_state.tasks.length
          ? _state.tasks.length + ' task' + (_state.tasks.length === 1 ? '' : 's') + ' needing attention.'
          : 'No tasks right now.');
      })
      .withFailureHandler(() => {
        _busyEnd();
        Toast.show('Could not refresh tasks.', 'error');
      })
      .getMyTasks();
  }

  // ── Module loader ─────────────────────────────────────────
  // focus (optional): { sourceType, sourceId, taskId } — a deep-link
  // request. It is set on window.__focus BEFORE the module's scripts run,
  // so a module that supports deep-linking can read it during its own
  // init and open/highlight that record. Modules that don't support focus
  // simply ignore window.__focus and open normally. The shell never needs
  // to know what any module does with it — that's the loose-coupling seam.
  //
  // The busy overlay is armed for the fetch: the inline .module-loading
  // spinner remains as the content placeholder, but the overlay is what
  // blocks stray clicks (nav, header) while the module HTML is in flight.
  // _busyEnd() runs FIRST in the success handler, before the module's own
  // scripts execute — so if the module's init() makes its own App.call,
  // that call re-arms the overlay cleanly with its own flicker guard.
  function loadModule(moduleKey, focus) {
    _setActiveNav(moduleKey);
    A11y.release();   // drop any modal trap left by the outgoing module
    const container = document.getElementById('module-container');
    container.innerHTML = '<div class="module-loading" role="status" aria-live="polite">' +
      '<div class="spinner" aria-hidden="true"></div><span>Loading…</span></div>';

    _busyBegin('Loading ' + _moduleLabel(moduleKey) + '…');
    google.script.run
      .withSuccessHandler(html => {
        _busyEnd();
        container.innerHTML = html;
        _state.activePage = moduleKey;
        _setHash(moduleKey);   // persist the view in the parent URL (and
                               // consume any deep-link ?page=&focus= params)
        // Publish the deep-link focus (or clear it) before scripts execute.
        window.__focus = focus || null;
        container.querySelectorAll('script').forEach(s => {
          const fresh = document.createElement('script');
          if (s.src) fresh.src = s.src; else fresh.textContent = s.textContent;
          document.head.appendChild(fresh).remove();
        });
        if (window.innerWidth <= 720) document.getElementById('sidebar').classList.add('collapsed');
        const label = _moduleLabel(moduleKey);
        _setTitle(label);
        A11y.focusMain();
        A11y.announce(label + ' loaded.');
      })
      .withFailureHandler(err => {
        _busyEnd();
        container.innerHTML = `
          <div class="card">
            <div style="color:var(--color-danger);display:flex;align-items:center;gap:8px;">
              <i class="ti ti-alert-circle" aria-hidden="true"></i><strong>Error loading module</strong>
            </div>
            <p style="margin-top:8px;color:var(--color-muted);font-size:13px;">${_esc(err.message)}</p>
          </div>`;
        Toast.show(err.message || 'Failed to load module', 'error');
        A11y.focusMain();
      })
      .getModuleHTML(moduleKey);
  }

  // ── Busy overlay ──────────────────────────────────────────
  // One full-screen click blocker for every slow round-trip, so a
  // lagging call can't be double-submitted by an impatient click.
  // It turns on two ways, and stays up while EITHER wants it:
  //   AUTO   — call() and loadModule() arm it on every server call.
  //            Flicker guard: it becomes visible only if the call is
  //            still pending after BUSY_DELAY ms, so instantaneous
  //            calls never flash it. A counter handles overlapping
  //            calls — the overlay hides when the LAST one finishes,
  //            and both the success and failure paths release it, so
  //            a module can never strand the user behind it.
  //   MANUAL — App.busy(msg[, detail]) / App.busyProgress(msg, done,
  //            total[, detail]) show it immediately with a custom
  //            message and hold it until App.idle(). For multi-step
  //            client work (reading files, chained calls). Modules'
  //            old local _busy/_idle helpers become one-line wrappers
  //            over these.
  // The two are independent by design: the migrated-module pattern
  // (_busy('Submitting…') → App.call(...) → _idle() in the callback)
  // works because the manual hold carries the custom message while the
  // auto counter tracks the call underneath it.

  const BUSY_DELAY = 300;   // ms a call must lag before the overlay shows
  let _busyAuto    = 0;     // pending auto-armed calls
  let _busyTimer   = null;  // flicker-guard timer
  let _busyShown   = false; // the auto path has revealed the overlay
  let _busyManual  = false; // App.busy() hold
  let _busyAutoMsg = '';    // message for the next auto reveal

  function _busyRender() {
    const el = document.getElementById('app-busy');
    if (!el) return;
    el.style.display = (_busyManual || _busyShown) ? 'flex' : 'none';
  }

  function _busySetMsg(msg, detail) {
    const m = document.getElementById('app-busy-msg');
    if (m) m.textContent = msg || 'Working…';
    const d = document.getElementById('app-busy-detail');
    if (d) {
      d.textContent = detail || '';
      d.style.display = detail ? 'block' : 'none';
    }
  }

  /** Indeterminate mode: animated sweep (atomic server calls). */
  function _busyIndet() {
    const bar = document.getElementById('app-busy-bar');
    if (!bar) return;
    bar.classList.add('app-busy-indet');
    bar.style.marginLeft = '';
    bar.style.width = '40%';
  }

  /** AUTO arm: one server call went out. */
  function _busyBegin(msg) {
    _busyAuto++;
    if (msg) _busyAutoMsg = msg;
    if (_busyAuto === 1 && !_busyTimer && !_busyShown) {
      _busyTimer = setTimeout(function () {
        _busyTimer = null;
        if (_busyAuto > 0) {
          _busyShown = true;
          // Don't clobber a custom message a manual hold already set.
          if (!_busyManual) { _busySetMsg(_busyAutoMsg); _busyIndet(); }
          _busyRender();
        }
      }, BUSY_DELAY);
    }
  }

  /** AUTO release: that call finished (success OR failure). */
  function _busyEnd() {
    _busyAuto = Math.max(0, _busyAuto - 1);
    if (_busyAuto === 0) {
      if (_busyTimer) { clearTimeout(_busyTimer); _busyTimer = null; }
      _busyShown = false;
      _busyAutoMsg = '';
      _busyRender();
    }
  }

  /** MANUAL: show now with a custom message, hold until idle(). */
  function busy(msg, detail) {
    _busyManual = true;
    _busySetMsg(msg, detail);
    _busyIndet();
    _busyRender();
  }

  /** MANUAL, determinate: real progress (done of total fills the bar). */
  function busyProgress(msg, done, total, detail) {
    _busyManual = true;
    _busySetMsg(msg, detail);
    const bar = document.getElementById('app-busy-bar');
    if (bar) {
      bar.classList.remove('app-busy-indet');
      bar.style.marginLeft = '0';
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      bar.style.width = Math.min(100, Math.max(2, pct)) + '%';
    }
    _busyRender();
  }

  /** Releases a manual hold (still-pending auto calls keep it visible). */
  function idle() {
    _busyManual = false;
    if (_busyShown) { _busySetMsg(_busyAutoMsg); _busyIndet(); }
    _busyRender();
  }

  // ── Server call helper ────────────────────────────────────
  // busyMsg (optional): custom overlay text if this call lags past the
  // flicker guard; defaults to "Working…". The overlay is armed on
  // EVERY call and released on both success and failure — _busyEnd()
  // runs BEFORE the callbacks, so a callback that fires another call
  // (or shows its own App.busy) starts clean.
  function call(module, action, payload, onSuccess, onError, busyMsg) {
    _busyBegin(busyMsg);
    google.script.run
      .withSuccessHandler(function (res) {
        _busyEnd();
        if (onSuccess) onSuccess(res);
      })
      .withFailureHandler(function (err) {
        _busyEnd();
        const msg = (err && err.message) || 'An error occurred.';
        Toast.show(msg, 'error');
        if (onError) onError(err);
      })
      .dispatch(module, action, payload);
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const collapsed = sidebar.classList.toggle('collapsed');
    const btn = document.getElementById('nav-toggle');
    if (btn) btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }

  function _setActiveNav(key) {
    document.querySelectorAll('.nav-item').forEach(a => {
      const on = a.dataset.module === key;
      a.classList.toggle('active', on);
      // aria-current is what conveys "you are here" to a screen reader;
      // the .active class is purely visual.
      if (on) a.setAttribute('aria-current', 'page');
      else    a.removeAttribute('aria-current');
    });
  }

  /** The sidebar label for a module key, falling back to the key itself. */
  function _moduleLabel(key) {
    const m = (_state.modules || []).find(x => x.key === key);
    return (m && m.label) || key;
  }

  /** Keeps the document title in step with the view (orientation + history). */
  function _setTitle(label) {
    document.title = label ? (label + ' · ' + _baseTitle) : _baseTitle;
  }

  // Persist the current view in the PARENT (address-bar) URL so a browser
  // refresh restores it — _route() reads it back via
  // google.script.url.getLocation(). window.location here would only touch
  // the sandboxed iframe's URL, which never reaches the address bar and
  // does not survive a reload.
  //
  // params is passed as {} in an attempt to scrub any ?page=&focus=
  // deep-link query string, but Apps Script has been observed to leave
  // existing params in place regardless. That's why the hash outranks the
  // params in _route(), and why — when a deep link started this session —
  // even the dashboard writes an explicit '#dashboard' sentinel instead of
  // a clean URL: a refresh must find SOME hash, or the lingering ?page=
  // would replay the deep link. replace (not push) keeps in-app navigation
  // out of the browser's back-button history.
  function _setHash(key) {
    let next = (key && key !== 'dashboard') ? key : '';
    if (!next && _hadPageParam) next = 'dashboard';
    try {
      google.script.history.replace(null, {}, next);
    } catch (e) {
      // history API unavailable — navigation still works, refresh-restore
      // just silently degrades to opening the dashboard.
    }
  }

  // Whether moduleKey is in the user's role-filtered, enabled module list
  // (the same list the sidebar is built from). Used to validate a restored
  // hash so an unknown/disabled/forbidden key silently falls through.
  function _moduleAllowed(key) {
    return (_state.modules || []).some(m => m.key === key);
  }

  // Current module/page key, read by modules to detect whether they are still
  // the live page before running deferred (async-callback) UI work.
  function currentPage() { return _state.activePage; }

  // Standardized deep-link card for a module's settings tab. Returns HTML
  // showing the module's form deep link (alias-based) with a copy button and
  // the roles that can use it. moduleKey is the page/registry key; opts.focus
  // defaults to 'form' (the standardized "open this module's form" token).
  function deepLinkCard(moduleKey, opts) {
    opts = opts || {};
    const base = _state.publicBaseUrl || '';
    if (!base) return '';
    const sep = base.indexOf('?') === -1 ? '?' : '&';
    const url = base + sep + 'page=' + encodeURIComponent(moduleKey)
              + '&focus=' + encodeURIComponent(opts.focus || 'form');
    const roleLine = (opts.roles && opts.roles.length)
      ? '<p class="text-sm text-muted" style="margin:8px 0 0;">Works for: ' + _esc(opts.roles.join(', ')) + '</p>'
      : '';
    const title = _esc(opts.title || 'Direct link to this form');
    const note  = _esc(opts.note || 'Share this link to send people straight to the form. They will sign in first if needed.');
    const fieldId = 'dl-' + _esc(moduleKey);
    return ''
      + '<div class="card" style="margin-top:20px;">'
      +   '<div class="card-title"><i class="ti ti-link" aria-hidden="true"></i> ' + title + '</div>'
      +   '<p class="text-sm text-muted" style="margin-bottom:10px;">' + note + '</p>'
      +   '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'
      +     '<label class="visually-hidden" for="' + fieldId + '">' + title + '</label>'
      +     '<input class="form-input" id="' + fieldId + '" readonly value="' + _esc(url) + '" '
      +       'style="flex:1 1 280px;font-family:monospace;font-size:12.5px;" onclick="this.select();">'
      +     '<button class="btn btn-secondary btn-sm" onclick="App.copyDeepLink(\'' + _esc(moduleKey) + '\')">'
      +       '<i class="ti ti-copy" aria-hidden="true"></i> Copy</button>'
      +   '</div>' + roleLine
      + '</div>';
  }

  // Copy a rendered deep-link field's value to the clipboard.
  function copyDeepLink(moduleKey) {
    const el = document.getElementById('dl-' + moduleKey);
    if (!el) return;
    el.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(el.value).then(function () { Toast.show('Link copied.', 'success'); });
      } else {
        document.execCommand('copy');
        Toast.show('Link copied.', 'success');
      }
    } catch (e) { Toast.show('Press Ctrl/Cmd+C to copy.', 'info'); }
  }

  // Escapes for HTML text AND for quoted attribute values. The single-quote
  // rule matters: this function's output is interpolated into
  // onclick="App.something('…')", where a raw apostrophe would terminate the
  // JS string literal and let the rest be parsed as code.
  function _esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  return { init, goDashboard, loadModule, call, toggleSidebar, openTask, taskKey,
           refreshTasks, currentPage, deepLinkCard, copyDeepLink, esc: _esc,
           busy, busyProgress, idle };
})();


// ============================================================
// Toast
// ============================================================
const Toast = (() => {
  /**
   * Shows a transient message.
   *
   * SECURITY: `message` is escaped. This function is the sink for
   * App.call()'s failure handler, and server error strings are built from
   * user-supplied data ("No portal profile found for <email>", import row
   * errors, etc.) — interpolating them raw made every such message an
   * injection point.
   *
   * Error toasts get role="alert" so they interrupt a screen reader; the
   * container's own aria-live="polite" covers the rest.
   */
  function show(message, type, duration) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    const icon = type === 'success' ? 'ti-circle-check' : type === 'error' ? 'ti-alert-circle' : 'ti-info-circle';
    el.className = `toast toast-${type || 'info'}`;
    if (type === 'error') el.setAttribute('role', 'alert');
    const i = document.createElement('i');
    i.className = 'ti ' + icon;
    i.setAttribute('aria-hidden', 'true');
    i.style.fontSize = '16px';
    i.style.flexShrink = '0';
    const span = document.createElement('span');
    span.textContent = String(message == null ? '' : message);   // never innerHTML
    el.appendChild(i);
    el.appendChild(span);
    container.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, duration || 3500);
  }
  return { show };
})();


// ============================================================
// FormHelper
// ============================================================
const FormHelper = (() => {

  let _errSeq = 0;   // for generating ids on unlabeled .form-error nodes

  function collect(containerId) {
    const container = document.getElementById(containerId);
    const inputs = container.querySelectorAll('[name]');
    const data = {};
    let isValid = true;
    let firstBad = null;
    let badCount = 0;

    inputs.forEach(el => {
      const errEl = el.parentElement.querySelector('.form-error');
      _clear(el, errEl);
      const val = el.value.trim();
      if (el.hasAttribute('required') && !val) {
        _err(el, errEl, 'This field is required.');
        isValid = false; badCount++; firstBad = firstBad || el;
      }
      if (el.type === 'email' && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        _err(el, errEl, 'Enter a valid email address.');
        isValid = false; badCount++; firstBad = firstBad || el;
      }
      data[el.name] = val;
    });

    // Without this a keyboard or screen-reader user submits, nothing
    // apparently happens, and the only feedback is a red border they may
    // not be able to see.
    if (!isValid) {
      A11y.announce(badCount === 1
        ? 'There is a problem with one field. ' + _messageFor(firstBad)
        : 'There are problems with ' + badCount + ' fields.', true);
      if (firstBad && typeof firstBad.focus === 'function') {
        try { firstBad.focus(); } catch (e) {}
      }
    }

    return { data, isValid };
  }

  function reset(containerId) {
    document.getElementById(containerId).querySelectorAll('[name]').forEach(el => {
      el.value = '';
      const errEl = el.parentElement.querySelector('.form-error');
      _clear(el, errEl);
    });
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId); if (!btn) return;
    if (btn.dataset.originalText === undefined) btn.dataset.originalText = btn.innerHTML;
    btn.disabled = loading;
    // aria-busy tells assistive tech the control is mid-operation; the
    // spinner alone is a purely visual cue.
    btn.setAttribute('aria-busy', loading ? 'true' : 'false');
    btn.innerHTML = loading
      ? '<i class="ti ti-loader-2" aria-hidden="true" style="animation:spin 0.7s linear infinite"></i> ' + (label || 'Saving…')
      : btn.dataset.originalText;
  }

  /** The visible error text for a field, for the announcement. */
  function _messageFor(el) {
    if (!el || !el.parentElement) return '';
    const errEl = el.parentElement.querySelector('.form-error');
    return errEl ? errEl.textContent : '';
  }

  /**
   * Marks a field invalid: red border (visual), aria-invalid (programmatic),
   * and aria-describedby pointing at the error node so the message is read
   * when focus lands on the field.
   */
  function _err(el, errEl, msg) {
    el.style.borderColor = 'var(--color-danger)';
    el.setAttribute('aria-invalid', 'true');
    if (!errEl) return;
    if (!errEl.id) errEl.id = 'form-err-' + (++_errSeq);
    errEl.textContent = msg;
    errEl.classList.add('visible');
    const ids = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
    if (ids.indexOf(errEl.id) === -1) ids.push(errEl.id);
    el.setAttribute('aria-describedby', ids.join(' '));
  }

  function _clear(el, errEl) {
    el.style.borderColor = '';
    el.removeAttribute('aria-invalid');
    if (errEl) errEl.classList.remove('visible');
  }

  return { collect, reset, setLoading };
})();
</script>
